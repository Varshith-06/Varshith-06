<svg viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','SF Mono',monospace">
  <defs>
    <!-- background gradient: deep space violet -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08060f"/>
      <stop offset="0.5" stop-color="#0d0b1f"/>
      <stop offset="1" stop-color="#050409"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#8a2be2"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="hard"><feGaussianBlur stdDeviation="0.6"/></filter>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="340" fill="url(#bg)"/>
  <ellipse cx="600" cy="150" rx="620" ry="220" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#1a2740" stroke-width="1" opacity="0.4">
    <line x1="0" y1="85" x2="1200" y2="85"/>
    <line x1="0" y1="170" x2="1200" y2="170"/>
    <line x1="0" y1="255" x2="1200" y2="255"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="600" y1="0" x2="600" y2="340"/>
    <line x1="900" y1="0" x2="900" y2="340"/>
  </g>

  <!-- ============ NEURAL AGENT NETWORK (left cluster) ============ -->
  <!-- edges pulse, nodes breathe: this is the "agents negotiating" motif -->
  <g stroke="url(#cyan)" stroke-width="1.4" fill="none" opacity="0.55">
    <path d="M120 90 L210 150"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></path>
    <path d="M120 90 L180 240"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.1s" repeatCount="indefinite"/></path>
    <path d="M210 150 L180 240"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></path>
    <path d="M210 150 L300 110"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></path>
    <path d="M180 240 L300 250"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></path>
    <path d="M300 110 L300 250"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="3.4s" repeatCount="indefinite"/></path>
  </g>
  <!-- signal packet travelling an edge -->
  <circle r="3.5" fill="#ffffff">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M120 90 L210 150"/>
    <animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#00f0ff">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M180 240 L300 250"/>
  </circle>

  <g fill="#0d0b1f" stroke="#00f0ff" stroke-width="2">
    <circle cx="120" cy="90" r="9"><animate attributeName="r" values="9;12;9" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="150" r="11"><animate attributeName="r" values="11;8;11" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="240" r="8"><animate attributeName="r" values="8;12;8" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="110" r="10"><animate attributeName="r" values="10;7;10" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="250" r="9" stroke="#8a2be2"><animate attributeName="r" values="9;13;9" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ============ NAME + role (center) ============ -->
  <g transform="translate(600,140)" text-anchor="middle">
    <text font-size="58" font-weight="700" letter-spacing="2" fill="#e8f6ff">
      SAI VARSHITH
      <animate attributeName="opacity" values="1;0.82;1" dur="4s" repeatCount="indefinite"/>
    </text>
    <!-- glitch echo layers -->
    <text font-size="58" font-weight="700" letter-spacing="2" fill="#00f0ff" opacity="0.55" filter="url(#hard)">
      <tspan x="0" dy="0">SAI VARSHITH</tspan>
      <animate attributeName="x" values="0;-3;2;0" dur="0.28s" begin="0s;glitch.end+3.5s" id="glitch" fill="freeze"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="0.28s" begin="0s;glitch.end+3.5s"/>
    </text>
    <text font-size="58" font-weight="700" letter-spacing="2" fill="#ff2d78" opacity="0.4" filter="url(#hard)">
      <tspan x="3" dy="0">SAI VARSHITH</tspan>
      <animate attributeName="opacity" values="0;0.45;0" dur="0.28s" begin="glitch.begin"/>
    </text>
  </g>
  <text x="600" y="180" text-anchor="middle" font-size="16" letter-spacing="5" fill="#7a8aa8">
    MATH &#215; ML &#215; MULTI-AGENT SYSTEMS
  </text>

  <!-- animated underline -->
  <rect x="440" y="196" width="320" height="2" fill="url(#cyan)">
    <animate attributeName="width" values="0;320" dur="1.2s" fill="freeze"/>
    <animate attributeName="x" values="600;440" dur="1.2s" fill="freeze"/>
  </rect>

  <!-- ============ AGENT TABLE (right cluster) ============ -->
  <!-- three agents ringed around a decision card that flips -->
  <g transform="translate(985,150)" stroke="url(#cyan)" stroke-width="1.4" fill="none" opacity="0.5">
    <path d="M-70 -55 L0 0"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></path>
    <path d="M75 -40 L0 0"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></path>
    <path d="M10 80 L0 0"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.3s" repeatCount="indefinite"/></path>
  </g>
  <!-- flipping decision card at the center of the table -->
  <g transform="translate(985,150)">
    <rect x="-24" y="-32" width="48" height="64" rx="7" fill="#0d0b1f" stroke="#00f0ff" stroke-width="2">
      <animate attributeName="width" values="48;5;48" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="x" values="-24;-2.5;-24" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="8" text-anchor="middle" font-size="30" font-weight="700" fill="#00f0ff">
      <animate attributeName="opacity" values="1;0;0;1" dur="3.2s" repeatCount="indefinite"/>
      A<tspan font-size="18" fill="#ff2d78">&#9824;</tspan>
    </text>
  </g>
  <!-- the three agent nodes -->
  <g transform="translate(985,150)" fill="#0d0b1f" stroke-width="2">
    <circle cx="-70" cy="-55" r="10" stroke="#00f0ff"><animate attributeName="r" values="10;13;10" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="75" cy="-40" r="9" stroke="#00f0ff"><animate attributeName="r" values="9;12;9" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="10" cy="80" r="10" stroke="#8a2be2"><animate attributeName="r" values="10;7;10" dur="2.3s" repeatCount="indefinite"/></circle>
  </g>
  <!-- packet feeding a decision to the table -->
  <circle r="3" fill="#ffffff" transform="translate(985,150)">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M-70 -55 L0 0"/>
    <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ============ live stat ticker (bottom bar) ============ -->
  <rect x="0" y="296" width="1200" height="44" fill="#06050c" opacity="0.85"/>
  <rect x="0" y="296" width="1200" height="1" fill="#1e2c48"/>
  <g font-size="14" fill="#9fb2d0">
    <circle cx="40" cy="318" r="4" fill="#3ffb8b"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="56" y="323"><tspan fill="#3ffb8b">status</tspan> building AgentOS &#183; <tspan fill="#00f0ff">CGPA</tspan> 9.18 &#183; <tspan fill="#00f0ff">LeetCode</tspan> Knight 1850+ &#183; <tspan fill="#00f0ff">ex-</tspan>Britannia DS Intern &#183; <tspan fill="#ff2d78">~4%</tspan> forecast MAPE &#183; <tspan fill="#8a2be2">B.Tech</tspan> Math &amp; Computing @ IIITM Gwalior</text>
  </g>

  <!-- scanline sweep over everything -->
  <rect x="0" y="0" width="1200" height="30" fill="#00f0ff" opacity="0.05">
    <animate attributeName="y" values="-30;340" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
