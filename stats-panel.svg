<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" font-family="'Fira Code','SF Mono',monospace">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0814"/><stop offset="1" stop-color="#06050c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#8a2be2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="14" fill="url(#pbg)"/>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="14" fill="none" stroke="#1c2740" stroke-width="1"/>

  <!-- window chrome -->
  <circle cx="26" cy="26" r="6" fill="#ff5f57"/><circle cx="48" cy="26" r="6" fill="#febc2e"/><circle cx="70" cy="26" r="6" fill="#28c840"/>
  <text x="600" y="31" text-anchor="middle" font-size="13" fill="#5c6b86">~/varshith — stack.sh</text>
  <line x1="0" y1="52" x2="1200" y2="52" stroke="#1c2740"/>

  <!-- animated proficiency bars -->
  <g font-size="14" fill="#c8d6ee">
    <!-- row template -->
    <g transform="translate(60,92)">
      <text x="0" y="5" fill="#00f0ff">python</text>
      <rect x="200" y="-8" width="700" height="12" rx="6" fill="#101a30"/>
      <rect x="200" y="-8" width="0" height="12" rx="6" fill="url(#bar)"><animate attributeName="width" values="0;665" dur="1.3s" fill="freeze"/></rect>
      <text x="920" y="5" fill="#6b7b97">ML · agents · backend</text>
    </g>
    <g transform="translate(60,132)">
      <text x="0" y="5" fill="#00f0ff">pytorch/tf</text>
      <rect x="200" y="-8" width="700" height="12" rx="6" fill="#101a30"/>
      <rect x="200" y="-8" width="0" height="12" rx="6" fill="url(#bar)"><animate attributeName="width" values="0;595" dur="1.3s" begin="0.15s" fill="freeze"/></rect>
      <text x="920" y="5" fill="#6b7b97">LSTM · TFT · CNN</text>
    </g>
    <g transform="translate(60,172)">
      <text x="0" y="5" fill="#00f0ff">optimization</text>
      <rect x="200" y="-8" width="700" height="12" rx="6" fill="#101a30"/>
      <rect x="200" y="-8" width="0" height="12" rx="6" fill="url(#bar)"><animate attributeName="width" values="0;560" dur="1.3s" begin="0.3s" fill="freeze"/></rect>
      <text x="920" y="5" fill="#6b7b97">OR · TSP · numerical</text>
    </g>
    <g transform="translate(60,212)">
      <text x="0" y="5" fill="#00f0ff">systems</text>
      <rect x="200" y="-8" width="700" height="12" rx="6" fill="#101a30"/>
      <rect x="200" y="-8" width="0" height="12" rx="6" fill="url(#bar)"><animate attributeName="width" values="0;525" dur="1.3s" begin="0.45s" fill="freeze"/></rect>
      <text x="920" y="5" fill="#6b7b97">FastAPI · Redis · Docker · k8s</text>
    </g>
  </g>
  <!-- blinking cursor -->
  <rect x="1150" y="230" width="10" height="16" fill="#00f0ff"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</svg>
